<!DOCTYPE html>
<html>
    <body>
        <canvas id="myCanvas" width="500" height="500" style="border:1px solid black;">
            If this text is displayed if your browser does not support HTML5 canvas.
        </canvas>
    <script type="text/javascript">
        let canvas=document.getElementById('myCanvas');
        let ctx=canvas.getContext('2d');
        ctx.fillStyle='lightgreen';
        ctx.fillRect(0,0,canvas.width,canvas.height);/*To draw the background of the smile*/
        ctx.beginPath();
        ctx.arc(250,250,170,0,Math.PI*2);/*Write the face of the smile.*/
        ctx.fillStyle='yellow';
        ctx.fill();
        ctx.strokeStyle='black';
        ctx.lineWidth=2;
        ctx.stroke();
        ctx.fillStyle='black';/*Write the eyes of the smile.*/
        ctx.beginPath();
        ctx.ellipse(195,200,12,20,0,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(305, 200, 12, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();/*write the nose*/
        ctx.moveTo(250,235);
        ctx.lineTo(250,300);
        ctx.lineWidth=2;
        ctx.strokeStyle='black';
        ctx.stroke();
        ctx.beginPath();/*Write the mouth*/
        ctx.arc(250,260,100,Math.PI*0.25,Math.PI*0.75);
        ctx.lineWidth=3;
        ctx.strokeStyle='black';
        ctx.stroke();
        ctx.fillStyle='green';
        ctx.font='bold 24px Arial';
        ctx.textAlign='center';
        ctx.fillText('The Canvas brought me to life!',250,470);
    </script>
    </body>
</html>
